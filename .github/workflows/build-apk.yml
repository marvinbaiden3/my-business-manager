name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          sudo apt update
          sudo apt install -y zip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Build APK
        run: buildozer android debug

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: business-manager-apk
          path: bin/*.apk
          retention-days: 14
          
